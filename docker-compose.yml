version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: crm_postgres
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: crm_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
